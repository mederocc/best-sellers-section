<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Best Sellers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,700;8..60,900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Poppins", "ui-sans-serif", "system-ui", "sans-serif"],
              serif: ['"Source Serif 4"', "Georgia", "serif"],
              bebas: ['"Bebas Neue"', "Impact", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      .product-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        column-gap: 11px;
        row-gap: 12px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .more-batch {
        display: grid;
        grid-template-rows: 0fr;
        transition: grid-template-rows 480ms ease;
      }

      .more-batch.is-open {
        grid-template-rows: 1fr;
      }

      .more-clip {
        min-height: 0;
        overflow: hidden;
      }

      .more-grid {
        padding-top: 12px;
      }

      .scrollbar-track {
        display: none;
      }

      @media (min-width: 1024px) {
        .product-scroller {
          width: calc(100% + 8rem);
          max-width: none;
          margin-right: -8rem;
          overflow-x: auto;
          scroll-snap-type: x mandatory;
          scroll-behavior: smooth;
          scroll-padding-inline: 0 8rem;
          overscroll-behavior-x: contain;
          scrollbar-width: none;
          cursor: grab;
        }

        .product-scroller.is-dragging,
        .product-scroller:has(+ .scrollbar-track.is-touching) {
          scroll-snap-type: none;
          scroll-behavior: auto;
        }

        .product-scroller.is-dragging {
          cursor: grabbing;
          user-select: none;
        }

        .product-scroller::-webkit-scrollbar {
          display: none;
        }

        .product-row {
          display: flex;
          gap: 24px;
          width: max-content;
          padding-inline-end: 8rem;
        }

        .product-grid,
        #more-products,
        .more-batch,
        .more-clip {
          display: contents;
        }

        .product-card {
          flex: 0 0 355px;
          width: 355px;
          scroll-snap-align: start;
        }

        .product-card.is-last {
          scroll-snap-align: end;
        }

        .more-grid {
          padding-top: 0;
        }

        .scrollbar-track.is-ready {
          position: relative;
          display: block;
          height: 4px;
          margin-top: 48px;
          border-radius: 999px;
          background: #ddd6d7;
          cursor: pointer;
          touch-action: none;
        }

        .scrollbar-thumb {
          position: absolute;
          top: 0;
          left: 0;
          height: 4px;
          border-radius: 999px;
          background: #231f20;
          transition: height 180ms ease, top 180ms ease;
        }

        .scrollbar-track:hover .scrollbar-thumb,
        .scrollbar-track.is-touching .scrollbar-thumb {
          top: -1px;
          height: 6px;
        }
      }

      [data-hover-image] {
        opacity: 0;
      }

      .group:hover [data-image],
      .group:focus-visible [data-image] {
        opacity: 0;
      }

      .group:hover [data-hover-image],
      .group:focus-visible [data-hover-image] {
        opacity: 1;
      }

      @media (prefers-reduced-motion: no-preference) {
        .product-image {
          transition: opacity 300ms;
        }

        @starting-style {
          [data-hover-image] {
            opacity: 0;
          }
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .more-batch,
        .scrollbar-thumb,
        .product-image {
          transition: none;
        }

        .product-scroller {
          scroll-behavior: auto;
        }
      }
    </style>
  </head>
  <body class="bg-white font-sans text-[#1c1d1d] antialiased">
    <main>
      <section class="px-6 py-9 lg:px-32 lg:pb-[100px] lg:pt-20" aria-labelledby="best-sellers-heading">
        <div class="flex flex-col gap-6 lg:gap-9">
          <div class="flex items-center justify-between">
            <h1
              id="best-sellers-heading"
              class="w-full text-center font-serif text-[28px] font-bold leading-[1.26] tracking-[-0.28px] text-[#231f20] lg:w-auto lg:text-left lg:text-[40px] lg:font-black lg:leading-[1.2] lg:tracking-[-0.4px]"
            >
              Best Sellers
            </h1>
            <a
              href="#all-best-sellers"
              class="hidden shrink-0 items-center gap-2 rounded-full px-8 py-4 font-sans text-[14px] font-semibold leading-[1.4] tracking-[0.42px] text-[#5c553a] lg:inline-flex"
            >
              Shop All Best Sellers
              <img src="assets/arrow.svg" alt="" width="20" height="20" />
            </a>
          </div>

          <div class="min-w-0 w-full">
            <div id="product-scroller" class="product-scroller" tabindex="0" aria-label="Best seller products">
              <div class="product-row">
                <ul id="product-grid" class="product-grid"></ul>
                <div id="more-products"></div>
              </div>
            </div>

            <div id="scrollbar-track" class="scrollbar-track" aria-hidden="true">
              <div id="scrollbar-thumb" class="scrollbar-thumb"></div>
            </div>
          </div>
        </div>

        <button
          id="show-more"
          type="button"
          class="mt-3 flex h-[54px] w-full items-center justify-center rounded-full bg-[#1c1d1d] px-6 font-sans text-[16px] font-semibold leading-[1.4] tracking-[0.48px] text-[#fffffa] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#231f20] lg:hidden"
          aria-expanded="false"
          aria-controls="more-products"
        >
          Show More
        </button>
      </section>
    </main>
    <template id="product-card">
      <li class="product-card">
        <article class="flex flex-col gap-2 pb-2 lg:pb-4">
          <a data-product-link class="group block rounded-[10px] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#231f20]">
            <div class="relative aspect-square overflow-hidden rounded-[10px] lg:size-[355px]">
              <img data-image class="product-image absolute inset-0 h-full w-full object-cover" alt="" width="900" height="900" />
              <img data-hover-image class="product-image absolute inset-0 h-full w-full object-cover" alt="" width="900" height="900" aria-hidden="true" />
              <div class="absolute inset-x-1 top-1 flex items-start justify-between lg:inset-x-2 lg:top-2">
                <span data-badge="bestseller" class="inline-flex rounded-full border border-black bg-white px-2 py-1 font-bebas text-[8px] leading-none tracking-[0.32px] text-black lg:text-[10px] lg:tracking-[0.6px]">BEST SELLER</span>
                <span data-badge="sale" class="inline-flex rounded-full border border-black bg-[#5c7962] px-2 py-1 font-bebas text-[8px] leading-none tracking-[0.32px] text-[#fffffa] lg:text-[10px] lg:tracking-[0.6px]">SAVE 15%</span>
              </div>
            </div>
            <h2 data-title class="mt-3 px-2 font-bebas text-[16px] uppercase leading-[19px] tracking-[0.48px] text-[#1c1d1d] lg:mt-4 lg:px-3 lg:text-[18px] lg:leading-[22px] lg:tracking-[0.54px]">
              <span data-short-name class="lg:hidden"></span>
              <span data-full-name class="hidden lg:inline"></span>
            </h2>
          </a>
          <div class="flex flex-col gap-2 px-2 lg:px-3">
            <p class="flex items-center gap-1">
              <span data-stars class="flex items-center gap-0.5">
                <img data-star src="assets/star.svg" alt="" class="hidden h-[9px] w-[9px] lg:h-3 lg:w-3" />
                <img data-star src="assets/star.svg" alt="" class="hidden h-[9px] w-[9px] lg:h-3 lg:w-3" />
                <img data-star src="assets/star.svg" alt="" class="hidden h-[9px] w-[9px] lg:h-3 lg:w-3" />
                <img data-star src="assets/star.svg" alt="" class="hidden h-[9px] w-[9px] lg:h-3 lg:w-3" />
                <img data-star src="assets/star.svg" alt="" class="hidden h-[9px] w-[9px] lg:h-3 lg:w-3" />
                <img data-half-star src="assets/star-half.svg" alt="" class="hidden h-[9px] w-[9px] -rotate-90 lg:h-3 lg:w-3" />
              </span>
              <span data-reviews class="font-sans text-[11px] leading-[17px] text-[#707070] lg:text-[12px] lg:leading-[18px]"></span>
            </p>
            <p data-price class="font-sans text-[16px] font-medium leading-[24px] text-[#1c1d1d]"></p>
          </div>
        </article>
      </li>
    </template>
    <script type="module" src="./main.js"></script>
  </body>
</html>
